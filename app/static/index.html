<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indie Analytics</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #0b0f19;
            --card: #151b2b;
            --text: #e2e8f0;
            --accent: #38bdf8;
            --green: #4ade80;
            --border: #1e293b;
            --hover: #1e293b;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border);
        }
        
        h1 {
            font-size: 1.8rem;
            font-weight: 600;
            letter-spacing: -0.5px;
        }
        
        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            background: var(--card);
            border-radius: 6px;
            font-size: 0.9rem;
        }
        
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--green);
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        
        /* FILTERS SECTION */
        .filters-section {
            background: var(--card);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
        }
        
        .filters-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .filters-title {
            font-size: 1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .filters-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }
        
        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        
        .filter-label {
            font-size: 0.85rem;
            color: #94a3b8;
            font-weight: 500;
        }
        
        .filter-input {
            padding: 8px 12px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }
        
        .filter-input:focus {
            border-color: var(--accent);
        }
        
        .filter-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid var(--border);
        }
        
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .btn-primary {
            background: var(--accent);
            color: var(--bg);
        }
        
        .btn-primary:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }
        
        .btn-secondary {
            background: var(--border);
            color: var(--text);
        }
        
        .btn-secondary:hover {
            background: #334155;
        }
        
        .active-filters {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 10px;
        }
        
        .filter-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            background: rgba(56, 189, 248, 0.15);
            border: 1px solid var(--accent);
            border-radius: 4px;
            font-size: 0.85rem;
            color: var(--accent);
        }
        
        .filter-tag-remove {
            cursor: pointer;
            font-weight: bold;
            padding: 0 4px;
        }
        
        .filter-tag-remove:hover {
            color: #f87171;
        }
        
        /* MAIN GRID */
        .main-grid {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .chart-section {
            background: var(--card);
            border-radius: 12px;
            padding: 25px;
            border: 1px solid var(--border);
        }
        
        .stats-panel {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .stat-card {
            background: var(--card);
            border-radius: 10px;
            padding: 20px;
            border: 1px solid var(--border);
        }
        
        .stat-label {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--accent);
        }
        
        .stat-subtitle {
            font-size: 0.9rem;
            color: #64748b;
            margin-top: 5px;
        }
        
        .legend {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .legend-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            background: rgba(255,255,255,0.03);
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .legend-item:hover {
            background: rgba(255,255,255,0.06);
        }
        
        .legend-color {
            width: 12px;
            height: 12px;
            border-radius: 3px;
            margin-right: 10px;
        }
        
        .legend-label {
            flex: 1;
            font-size: 0.95rem;
        }
        
        .legend-count {
            font-weight: 600;
            color: var(--accent);
        }
        
        /* LOG SECTION */
        .log-section {
            background: var(--card);
            border-radius: 12px;
            padding: 25px;
            border: 1px solid var(--border);
            grid-column: 1 / -1;
        }
        
        .log-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .log-title {
            font-size: 1.1rem;
            font-weight: 600;
        }
        
        .log-count {
            background: var(--accent);
            color: var(--bg);
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 600;
        }
        
        .log-container {
            max-height: 600px;
            overflow-y: auto;
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            font-size: 0.9rem;
        }
        
        .log-container::-webkit-scrollbar {
            width: 8px;
        }
        
        .log-container::-webkit-scrollbar-track {
            background: var(--bg);
            border-radius: 4px;
        }
        
        .log-container::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }
        
        .log-container::-webkit-scrollbar-thumb:hover {
            background: #334155;
        }
        
        .log-entry {
            border-bottom: 1px solid var(--border);
            transition: background 0.15s;
        }
        
        .log-entry:hover {
            background: rgba(255,255,255,0.02);
        }
        
        .log-entry:last-child {
            border-bottom: none;
        }
        
        .log-main {
            padding: 12px 15px;
            display: flex;
            gap: 15px;
            align-items: center;
            cursor: pointer;
        }
        
        .log-toggle {
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #64748b;
            font-size: 0.8rem;
            transition: transform 0.2s;
            flex-shrink: 0;
        }
        
        .log-entry.expanded .log-toggle {
            transform: rotate(90deg);
        }
        
        .log-time {
            color: #64748b;
            font-size: 0.85rem;
            min-width: 70px;
        }
        
        .log-game {
            color: var(--accent);
            font-weight: 600;
            min-width: 100px;
        }
        
        .log-event {
            color: var(--text);
            flex: 1;
            font-weight: 500;
        }
        
        .log-player {
            color: #94a3b8;
            font-size: 0.85rem;
            min-width: 120px;
            text-align: right;
        }
        
        .log-details {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
            background: rgba(0,0,0,0.2);
        }
        
        .log-entry.expanded .log-details {
            max-height: 300px;
        }
        
        .log-details-content {
            padding: 15px 15px 15px 50px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
        }
        
        .detail-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        
        .detail-label {
            font-size: 0.75rem;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .detail-value {
            color: var(--text);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            word-break: break-all;
        }
        
        .detail-payload {
            grid-column: 1 / -1;
            background: var(--bg);
            padding: 10px;
            border-radius: 6px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 150px;
            overflow-y: auto;
        }
        
        @media (max-width: 900px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
            
            .log-player {
                display: none;
            }
            
            .filters-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎮 Indie Analytics</h1>
            <div class="status">
                <div class="status-dot"></div>
                <span>Live</span>
            </div>
        </header>
        
        <!-- FILTERS SECTION -->
        <div class="filters-section">
            <div class="filters-header">
                <div class="filters-title">🔍 Фильтры</div>
            </div>
            <div class="filters-grid">
                <div class="filter-group">
                    <label class="filter-label">ID Игры</label>
                    <input type="text" class="filter-input" id="filterGameId" placeholder="Например: indie_01">
                </div>
                <div class="filter-group">
                    <label class="filter-label">ID Игрока</label>
                    <input type="text" class="filter-input" id="filterPlayerId" placeholder="Например: player_42">
                </div>
                <div class="filter-group">
                    <label class="filter-label">Тип события</label>
                    <input type="text" class="filter-input" id="filterEventType" placeholder="Например: boss_killed">
                </div>
                <div class="filter-group">
                    <label class="filter-label">Сортировка</label>
                    <select class="filter-input" id="sortBy">
                        <option value="time_desc">Время (сначала новые)</option>
                        <option value="time_asc">Время (сначала старые)</option>
                        <option value="game">По игре</option>
                        <option value="player">По игроку</option>
                        <option value="event">По событию</option>
                    </select>
                </div>
            </div>
            <div class="filter-actions">
                <button class="btn btn-primary" onclick="applyFilters()">Применить фильтры</button>
                <button class="btn btn-secondary" onclick="resetFilters()">Сбросить</button>
            </div>
            <div class="active-filters" id="activeFilters"></div>
        </div>
        
        <div class="main-grid">
            <!-- Left: Chart -->
            <div class="chart-section">
                <canvas id="typeChart"></canvas>
                <div class="legend" id="legend"></div>
            </div>
            
            <!-- Right: Stats -->
            <div class="stats-panel">
                <div class="stat-card">
                    <div class="stat-label">Всего событий</div>
                    <div class="stat-value" id="totalEvents">0</div>
                    <div class="stat-subtitle">С учётом фильтров</div>
                </div>
                
                <div class="stat-card">
                    <div class="stat-label">Уникальных игроков</div>
                    <div class="stat-value" id="uniquePlayers">0</div>
                    <div class="stat-subtitle">В отфильтрованных данных</div>
                </div>
                
                <div class="stat-card">
                    <div class="stat-label">Игр отслеживается</div>
                    <div class="stat-value" id="uniqueGames">0</div>
                    <div class="stat-subtitle">Активных проектов</div>
                </div>
            </div>
            
            <!-- Log -->
            <div class="log-section">
                <div class="log-header">
                    <div class="log-title">📜 Лента событий</div>
                    <div class="log-count" id="logCount">0</div>
                </div>
                <div class="log-container" id="log"></div>
            </div>
        </div>
    </div>

    <script>
        // === LOCALSTORAGE ===
        const STORAGE_KEY = 'indie_analytics_data';
        let allEvents = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
        let filteredEvents = [...allEvents];
        let typeChart;
        let expandedLogs = new Set();

        // === FILTERS ===
        let currentFilters = {
            gameId: '',
            playerId: '',
            eventType: '',
            sortBy: 'time_desc'
        };

    function applyFilters() {
    // Безопасное чтение значений инпутов
    currentFilters.gameId = (document.getElementById('filterGameId').value || '').trim().toLowerCase();
    currentFilters.playerId = (document.getElementById('filterPlayerId').value || '').trim().toLowerCase();
    currentFilters.eventType = (document.getElementById('filterEventType').value || '').trim().toLowerCase();
    currentFilters.sortBy = document.getElementById('sortBy').value;
    
    // Фильтрация с защитой от undefined/null
    filteredEvents = allEvents.filter(event => {
        const eGame = (event.game_id || '').toLowerCase();
        const ePlayer = (event.player_id || '').toLowerCase();
        const eEvent = (event.event_type || '').toLowerCase();
        
        const matchGame = !currentFilters.gameId || eGame.includes(currentFilters.gameId);
        const matchPlayer = !currentFilters.playerId || ePlayer.includes(currentFilters.playerId);
        const matchEvent = !currentFilters.eventType || eEvent.includes(currentFilters.eventType);
        
        return matchGame && matchPlayer && matchEvent;
    });
    
    // Сортировка
    filteredEvents.sort((a, b) => {
        switch(currentFilters.sortBy) {
            case 'time_asc': return new Date(a.created_at) - new Date(b.created_at);
            case 'time_desc': return new Date(b.created_at) - new Date(a.created_at);
            case 'game': return (a.game_id || '').localeCompare(b.game_id || '');
            case 'player': return (a.player_id || '').localeCompare(b.player_id || '');
            case 'event': return (a.event_type || '').localeCompare(b.event_type || '');
            default: return 0;
        }
    });
    
    showActiveFilters();
    updateUI();
    saveToStorage();
    } 

        function resetFilters() {
            document.getElementById('filterGameId').value = '';
            document.getElementById('filterPlayerId').value = '';
            document.getElementById('filterEventType').value = '';
            document.getElementById('sortBy').value = 'time_desc';
            
            currentFilters = {
                gameId: '',
                playerId: '',
                eventType: '',
                sortBy: 'time_desc'
            };
            
            filteredEvents = [...allEvents];
            showActiveFilters();
            updateUI();
        }

        function showActiveFilters() {
            const container = document.getElementById('activeFilters');
            const tags = [];
            
            if (currentFilters.gameId) tags.push(`<span class="filter-tag">Игра: ${currentFilters.gameId}<span class="filter-tag-remove" onclick="removeFilter('gameId')">×</span></span>`);
            if (currentFilters.playerId) tags.push(`<span class="filter-tag">Игрок: ${currentFilters.playerId}<span class="filter-tag-remove" onclick="removeFilter('playerId')">×</span></span>`);
            if (currentFilters.eventType) tags.push(`<span class="filter-tag">Событие: ${currentFilters.eventType}<span class="filter-tag-remove" onclick="removeFilter('eventType')">×</span></span>`);
            
            container.innerHTML = tags.join('');
        }

        function removeFilter(filterName) {
            currentFilters[filterName] = '';
            document.getElementById('filter' + filterName.charAt(0).toUpperCase() + filterName.slice(1)).value = '';
            applyFilters();
        }

        // === WEBSOCKET ===
        const WS_URL = `ws://${location.host}/ws`;
        let ws;

        function connectWebSocket() {
            ws = new WebSocket(WS_URL);
            
            ws.onopen = () => console.log('✅ WebSocket connected');
            
            ws.onmessage = (e) => {
                const metric = JSON.parse(e.data);
                addEvent(metric);
                applyFilters();
            };
            
            ws.onclose = () => {
                console.log('⚠️ WebSocket disconnected. Reconnecting...');
                setTimeout(connectWebSocket, 2000);
            };
            
            ws.onerror = (err) => console.error('WebSocket error:', err);
        }

        // === DATA MANAGEMENT ===
        function addEvent(metric) {
            allEvents.unshift({
                id: metric.id,
                game_id: metric.game_id,
                event_type: metric.event_type,
                payload: metric.payload,
                created_at: metric.created_at,
                player_id: metric.player_id,
            });
            
            if (allEvents.length > 10000) {
                allEvents = allEvents.slice(0, 10000);
            }
        }

        function saveToStorage() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(allEvents));
        }

        function loadFromStorage() {
            applyFilters();
        }

        // === UI UPDATES ===
        function updateUI() {
            updateStats();
            updateChart();
            renderLogs();
        }

        function updateStats() {
            const total = filteredEvents.length;
            const players = new Set(filteredEvents.map(e => e.player_id)).size;
            const games = new Set(filteredEvents.map(e => e.game_id)).size;
            
            document.getElementById('totalEvents').textContent = total.toLocaleString();
            document.getElementById('uniquePlayers').textContent = players.toLocaleString();
            document.getElementById('uniqueGames').textContent = games.toLocaleString();
            document.getElementById('logCount').textContent = total;
        }

        function updateChart() {
            const typeCounts = {};
            filteredEvents.forEach(e => {
                typeCounts[e.event_type] = (typeCounts[e.event_type] || 0) + 1;
            });
            
            const labels = Object.keys(typeCounts);
            const data = Object.values(typeCounts);
            const colors = ['#38bdf8', '#818cf8', '#c084fc', '#f472b6', '#fb923c', '#4ade80', '#f87171'];
            
            if (typeChart) {
                typeChart.data.labels = labels;
                typeChart.data.datasets[0].data = data;
                typeChart.update();
            } else {
                typeChart = new Chart(document.getElementById('typeChart'), {
                    type: 'doughnut',
                    data: {
                        labels: labels,
                        datasets: [{
                            data: data,
                            backgroundColor: colors,
                            borderWidth: 0,
                            hoverOffset: 10
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: true,
                        plugins: {
                            legend: { display: false },
                            tooltip: {
                                backgroundColor: 'rgba(15, 23, 42, 0.95)',
                                titleColor: '#e2e8f0',
                                bodyColor: '#e2e8f0',
                                borderColor: '#334155',
                                borderWidth: 1,
                                padding: 12,
                                displayColors: true,
                                callbacks: {
                                    label: function(context) {
                                        const label = context.label || '';
                                        const value = context.parsed || 0;
                                        const total = context.dataset.data.reduce((a, b) => a + b, 0);
                                        const percentage = ((value / total) * 100).toFixed(1);
                                        return `${label}: ${value} (${percentage}%)`;
                                    }
                                }
                            }
                        },
                        cutout: '65%'
                    }
                });
            }
            
            updateLegend(typeCounts, colors);
        }

        function updateLegend(typeCounts, colors) {
            const legendEl = document.getElementById('legend');
            const sortedTypes = Object.entries(typeCounts).sort((a, b) => b[1] - a[1]);
            
            legendEl.innerHTML = sortedTypes.map((type, i) => `
                <div class="legend-item" onclick="filterByType('${type[0]}')">
                    <div style="display: flex; align-items: center;">
                        <div class="legend-color" style="background: ${colors[i % colors.length]}"></div>
                        <span class="legend-label">${type[0]}</span>
                    </div>
                    <span class="legend-count">${type[1]}</span>
                </div>
            `).join('');
        }

        function filterByType(eventType) {
            document.getElementById('filterEventType').value = eventType;
            applyFilters();
        }

        function renderLogs() {
            const logEl = document.getElementById('log');
            logEl.innerHTML = '';
            
            filteredEvents.forEach(event => {
                const entry = document.createElement('div');
                entry.className = 'log-entry' + (expandedLogs.has(event.id) ? ' expanded' : '');
                
                const time = new Date(event.created_at).toLocaleTimeString('ru-RU', { 
                    hour12: false, 
                    hour: '2-digit', 
                    minute: '2-digit', 
                    second: '2-digit' 
                });
                
                const date = new Date(event.created_at).toLocaleDateString('ru-RU');
                
                entry.innerHTML = `
                    <div class="log-main" onclick="toggleLog(${event.id})">
                        <div class="log-toggle">▶</div>
                        <div class="log-time">${time}</div>
                        <div class="log-game">${event.game_id}</div>
                        <div class="log-event">${event.event_type}</div>
                        <div class="log-player">${event.player_id}</div>
                    </div>
                    <div class="log-details">
                        <div class="log-details-content">
                            <div class="detail-item">
                                <div class="detail-label">ID записи</div>
                                <div class="detail-value">${event.id}</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">Дата</div>
                                <div class="detail-value">${date}</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">Время</div>
                                <div class="detail-value">${time}</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">Игра</div>
                                <div class="detail-value">${event.game_id}</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">Игрок</div>
                                <div class="detail-value">${event.player_id}</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">Событие</div>
                                <div class="detail-value">${event.event_type}</div>
                            </div>
                            <div class="detail-payload">
                                <div class="detail-label" style="margin-bottom: 5px;">Payload (JSON):</div>
                                ${JSON.stringify(event.payload, null, 2)}
                            </div>
                        </div>
                    </div>
                `;
                
                logEl.appendChild(entry);
            });
        }

        function toggleLog(eventId) {
            if (expandedLogs.has(eventId)) {
                expandedLogs.delete(eventId);
            } else {
                expandedLogs.add(eventId);
            }
            renderLogs();
        }

        // === INIT ===
        connectWebSocket();
        loadFromStorage();
    </script>
</body>
</html>
